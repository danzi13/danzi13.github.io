<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play Crown Support</title>
    <meta
      name="description"
      content="Support, privacy policy, and terms for Crown."
    />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="background-dust" aria-hidden="true">
        <span class="dust dust-1"></span>
        <span class="dust dust-2"></span>
        <span class="dust dust-3"></span>
        <span class="dust dust-4"></span>
        <span class="dust dust-5"></span>
        <span class="dust dust-6"></span>
        <span class="dust dust-7"></span>
        <span class="dust dust-8"></span>
        <span class="dust dust-9"></span>
        <span class="dust dust-10"></span>
        <span class="dust dust-11"></span>
        <span class="dust dust-12"></span>
      </div>

      <main class="page">
        <section class="loading-stage">
          <div class="brand-lockup">
            <div class="brand-logo-shell" aria-hidden="true">
              <div class="brand-logo-halo"></div>
              <div class="brand-logo-ring"></div>
              <div class="brand-logo-card">
                <img class="brand-logo" src="./crown-square.png" alt="Crown app logo" />
              </div>
            </div>
            <h1>Play Crown</h1>
            <p class="brand-subtitle">Support, privacy, and feedback.</p>
          </div>
        </section>

        <section class="support-card">
          <div class="support-actions">
            <a class="support-button support-button-secondary" href="https://mail.google.com/mail/?view=cm&fs=1&to=danzimichael13@gmail.com&su=Play%20Crown%20Feedback" target="_blank" rel="noopener noreferrer">Email Me</a>
            <a
              class="support-button support-button-secondary"
              href="https://www.linkedin.com/in/michael-danzi-/"
              target="_blank"
              rel="noopener noreferrer"
              onclick="window.open('https://www.linkedin.com/in/michael-danzi-/', '_blank'); return false;"
            >
              LinkedIn
            </a>
            <a class="support-button support-button-secondary" href="#legal">View Policies</a>
          </div>
          <div class="contact-strip" id="contact-strip"></div>

          <section class="support-block">
            <div class="section-label">Need Help?</div>
            <h2>Reach support directly.</h2>
            <p>
              For account issues, bug reports, App Store questions, or anything weird,
              email <a href="https://mail.google.com/mail/?view=cm&fs=1&to=danzimichael13@gmail.com&su=Play%20Crown%20Feedback" target="_blank" rel="noopener noreferrer">danzimichael13@gmail.com</a>.
            </p>
          </section>

          <section class="support-block legal-card" id="legal">
            <div class="section-label">Policies</div>
            <div class="legal-header">
              <h2>Terms and Privacy</h2>
              <div class="legal-tabs" id="legal-tabs"></div>
            </div>
            <div id="legal-content" class="legal-content"></div>
          </section>
        </section>
      </main>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
